# Builds the unsigned SideStore .ipa on a GitHub-hosted Mac, so you don't need
# your own. Download it from the run's "Artifacts" section.
#
# macOS runner minutes are limited on private repositories. To build only on
# demand, delete the `push:` trigger and use "Run workflow" on the Actions tab.
name: Build unsigned IPA

on:
  push:
  workflow_dispatch:

jobs:
  check:
    name: Sideloading checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-sideload-compat.sh

  build:
    name: Build .ipa
    needs: check
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Build unsigned IPA
        run: ./scripts/build-ipa.sh --output build/ipa
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: build/ipa/*.ipa
          if-no-files-found: error
